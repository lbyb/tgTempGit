[project]
name = "douban-aa-search"
version = "0.3.0"
description = "豆瓣丛书批量搜索AA工具（前后端分离架构）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.0.0",
    "requests>=2.32.5",
]

[tool.uv]
dev-dependencies = [
    "debugpy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
