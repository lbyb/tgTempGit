[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pupdf"
version = "0.1.0"
description = "Create per-page PDF bookmarks and page labels from TOC/body start pages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pupdf contributors" }]
keywords = ["pdf", "bookmark", "outline", "page-label", "pymupdf"]
dependencies = [
    "PyMuPDF==1.24.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6.10,<7",
]

[project.scripts]
pupdf = "pupdf.cli:main"

[project.gui-scripts]
pupdf-gui = "pupdf.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# The GUI/CLI deliberately catch broad exceptions at the outermost boundary
# so a windowed Windows build can always show an error instead of vanishing.
ignore = ["BLE001", "S110"]
