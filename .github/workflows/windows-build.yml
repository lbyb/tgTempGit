name: windows-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build one-file GUI executable
        run: python -m PyInstaller --noconfirm --clean pupdf.spec

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Pupdf.exe")) { throw "Pupdf.exe was not built" }
          Get-Item "dist\Pupdf.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload Pupdf.exe
        uses: actions/upload-artifact@v4
        with:
          name: Pupdf-windows
          path: dist/Pupdf.exe
          if-no-files-found: error
